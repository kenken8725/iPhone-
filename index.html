<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhoneプロファイル作成</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f2f2f7;
  margin:0;
  padding:25px 15px;
}
.card{
  max-width:430px;
  margin:auto;
  background:white;
  border-radius:24px;
  padding:25px;
}
h1{font-size:24px}
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid #eee;
}
.switch{
  width:50px;
  height:30px;
  position:relative;
}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#d1d1d6;
  border-radius:30px;
}
.slider:before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  left:2px;
  top:2px;
  background:white;
  border-radius:50%;
  transition:.2s;
}
input:checked + .slider{background:#34c759}
input:checked + .slider:before{
  transform:translateX(20px);
}
button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#007aff;
  color:white;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>⚙️ iPhoneプロファイル作成</h1>

<p>禁止したい項目をONにしてください。</p>

<div class="item">
<span>アプリのインストール</span>
<label class="switch">
<input type="checkbox" id="install">
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>アプリの削除</span>
<label class="switch">
<input type="checkbox" id="remove">
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>カメラ</span>
<label class="switch">
<input type="checkbox" id="camera">
<span class="slider"></span>
</label>
</div>

<div class="item">
<span>スクリーンショット</span>
<label class="switch">
<input type="checkbox" id="screen">
<span class="slider"></span>
</label>
</div>

<button id="create">プロファイルを作成</button>

</div>

<script>
document.getElementById("create").onclick=function(){

let settings="";

if(document.getElementById("install").checked)
settings+="<key>allowAppInstallation</key><false/>";

if(document.getElementById("remove").checked)
settings+="<key>allowAppRemoval</key><false/>";

if(document.getElementById("camera").checked)
settings+="<key>allowCamera</key><false/>";

if(document.getElementById("screen").checked)
settings+="<key>allowScreenShot</key><false/>";

const profile=`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>PayloadContent</key>
<array>
<dict>
<key>PayloadDescription</key>
<string>iPhoneの制限設定</string>
<key>PayloadDisplayName</key>
<string>iPhone制限</string>
<key>PayloadIdentifier</key>
<string>com.kenken.restrictions</string>
<key>PayloadOrganization</key>
<string>KenKen</string>
<key>PayloadType</key>
<string>com.apple.applicationaccess</string>
<key>PayloadUUID</key>
<string>550E8400-E29B-41D4-A716-446655440000</string>
<key>PayloadVersion</key>
<integer>1</integer>
${settings}
</dict>
</array>

<key>PayloadDisplayName</key>
<string>KenKen iPhone Profile</string>
<key>PayloadIdentifier</key>
<string>com.kenken.iphone.profile</string>
<key>PayloadOrganization</key>
<string>KenKen</string>
<key>PayloadRemovalDisallowed</key>
<false/>
<key>PayloadType</key>
<string>Configuration</string>
<key>PayloadUUID</key>
<string>550E8400-E29B-41D4-A716-446655440001</string>
<key>PayloadVersion</key>
<integer>1</integer>
</dict>
</plist>`;

const blob=new Blob(
[profile],
{type:"application/x-apple-aspen-config"}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="KenKen-iPhone-Profile.mobileconfig";
document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),2000);
};
</script>

</body>
</html>
